<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rh — Rust Harness Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d2129; --border: #2a2f3a;
    --fg: #e6e8ee; --muted: #8b93a5; --accent: #4c8dff; --green: #35c07a;
    --red: #e5534b; --yellow: #d9a13b; --cyan: #3fb6c9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header .brand { font-weight: 600; } header .brand .rh { color: var(--accent); }
  header .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--green); } .dot.working { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  button.link:hover { background: var(--panel-2); }

  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 300px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  aside h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .tool { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--panel-2); margin-bottom: 6px; }
  .tool .name { font-family: ui-monospace, monospace; color: var(--accent); }
  .tool .desc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .kv span { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; color: var(--muted); font-family: ui-monospace, monospace; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #transcript { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .row { margin: 6px 0; max-width: 760px; }
  .sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; margin: 12px 0; }
  .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .you { color: var(--green); font-weight: 600; } .assistant { color: var(--cyan); font-weight: 600; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .toolcall { display: inline-flex; align-items: center; gap: 6px; color: var(--yellow); font-family: ui-monospace, monospace; font-size: 12px; }
  .toolresult { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; border-left: 2px solid var(--border); padding-left: 10px; }
  .toolresult.error { border-left-color: var(--red); } .toolresult .ok { color: var(--green); } .toolresult .err { color: var(--red); }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 16px; display: flex; gap: 10px; }
  footer input { flex: 1; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; color: var(--fg); padding: 10px 12px; font-size: 14px; outline: none; }
  footer input:focus { border-color: var(--accent); }
  footer button.primary { background: var(--accent); border: none; color: #fff; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  footer button.primary:disabled { opacity: .5; cursor: default; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .overlay.hidden { display: none; }
  .modal { width: 620px; max-width: 94vw; max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }

  .provider { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--panel-2); }
  .provider .head { display: flex; align-items: center; gap: 10px; }
  .provider .head .info { flex: 1; min-width: 0; }
  .provider .head .name { font-weight: 600; }
  .provider .head .url { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; word-break: break-all; }
  .provider .head .badge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .model-chip { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--fg); background: var(--panel); font-family: ui-monospace, monospace; }
  .model-chip:hover { border-color: var(--accent); }
  .model-chip.active { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  button.small { background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  button.small:hover { border-color: var(--accent); }
  button.small.danger:hover { border-color: var(--red); color: var(--red); }

  form.add { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  form.add h3 { margin: 0; font-size: 13px; }
  form.add label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  form.add input { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); padding: 8px 10px; font-size: 13px; outline: none; }
  form.add input:focus { border-color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="rh">rh</span> — Rust Harness Agent</div>
    <span class="pill" id="session">会话：—</span>
    <span class="pill" id="activeModel">模型：加载中…</span>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
    <button class="link" id="settingsBtn">设置</button>
  </header>

  <div class="layout">
    <aside>
      <div><h3>工具</h3><div id="tools">加载中…</div></div>
      <div><h3>插件</h3><div class="kv" id="plugins">—</div></div>
      <div><h3>服务</h3><div class="kv" id="services">—</div></div>
    </aside>
    <main>
      <div id="transcript"></div>
      <footer>
        <input id="input" placeholder="输入任务…（回车发送）" autocomplete="off" />
        <button class="primary" id="send">发送</button>
      </footer>
    </main>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2>模型设置</h2>
      <div id="providerList">加载中…</div>
      <form class="add" id="addForm">
        <h3>添加 Provider（OpenAI 兼容）</h3>
        <label>名称<input name="name" placeholder="例如：DeepSeek / OpenAI / 本地 Ollama" /></label>
        <label>Base URL<input name="base_url" placeholder="https://api.deepseek.com" /></label>
        <label>API Key<input name="api_key" type="password" placeholder="sk-…" /></label>
        <button class="primary" type="submit">保存 Provider</button>
      </form>
      <div style="margin-top:14px; text-align:right"><button class="small" id="closeBtn">关闭</button></div>
    </div>
  </div>

<script>
(function () {
  const transcript = document.getElementById('transcript');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const sessionEl = document.getElementById('session');
  const activeModelEl = document.getElementById('activeModel');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const overlay = document.getElementById('overlay');
  const providerList = document.getElementById('providerList');
  const addForm = document.getElementById('addForm');

  let ws, currentAssistant = null, working = false;

  function setStatus(s, t) { dot.className = 'dot ' + s; statusText.textContent = t; }
  function scrollBottom() { transcript.scrollTop = transcript.scrollHeight; }
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function addRow(n) { transcript.appendChild(n); scrollBottom(); }
  function textFromContent(c) { return Array.isArray(c) ? c.filter(b => b.kind === 'text').map(b => b.text).join('\n') : ''; }

  function ensureAssistant() {
    if (currentAssistant) return currentAssistant;
    const row = el('div', 'row');
    row.appendChild(el('div', 'assistant', '助手'));
    const msg = el('div', 'msg', '');
    row.appendChild(msg); addRow(row);
    currentAssistant = { el: msg };
    return currentAssistant;
  }

  function renderEvent(ev) {
    switch (ev.type) {
      case 'user_message': {
        const row = el('div', 'row');
        row.appendChild(el('div', 'you', '你'));
        row.appendChild(el('div', 'msg', textFromContent(ev.content)));
        addRow(row); currentAssistant = null; break;
      }
      case 'assistant_chunk': { ensureAssistant().el.textContent += ev.text; scrollBottom(); break; }
      case 'assistant_message': {
        const text = textFromContent(ev.content);
        if (currentAssistant) { if (text && !currentAssistant.el.textContent) currentAssistant.el.textContent = text; currentAssistant = null; }
        else if (text) { ensureAssistant().el.textContent = text; currentAssistant = null; }
        break;
      }
      case 'tool_call': {
        const row = el('div', 'row');
        const chip = el('span', 'toolcall', '⚙ ' + ev.tool_name + ' ');
        const args = document.createElement('code');
        args.style.color = 'var(--muted)';
        args.textContent = JSON.stringify(ev.arguments || {});
        chip.appendChild(args); row.appendChild(chip); addRow(row); currentAssistant = null; break;
      }
      case 'tool_result': {
        const row = el('div', 'row toolresult' + (ev.is_error ? ' error' : ''));
        row.appendChild(el('span', ev.is_error ? 'err' : 'ok', ev.is_error ? '✗ ' : '✓ '));
        let out; try { out = typeof ev.output === 'string' ? ev.output : JSON.stringify(ev.output); } catch (e) { out = String(ev.output); }
        if (out.length > 800) out = out.slice(0, 800) + '…';
        row.appendChild(document.createTextNode(out)); addRow(row); break;
      }
      case 'turn_start': { addRow(el('div', 'sep', '回合')); setWorking(true); break; }
      case 'turn_end': { setWorking(false); break; }
      default: break;
    }
  }

  function setWorking(on) { working = on; sendBtn.disabled = on; setStatus(on ? 'working' : 'on', on ? '工作中…' : '已连接'); }

  function send() {
    const text = input.value.trim();
    if (!text || working || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'input', text }));
    input.value = ''; input.focus();
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws');
    ws.onopen = () => setStatus('on', '已连接');
    ws.onclose = () => { setStatus('', '已断开 — 重连中…'); setTimeout(connect, 1500); };
    ws.onerror = () => setStatus('', '连接错误');
    ws.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch (err) { return; }
      if (data.type === 'hello') { sessionEl.textContent = '会话：' + data.session_id; return; }
      if (data.type === 'error') { addRow(el('div', 'row toolresult error', '错误：' + data.error)); return; }
      renderEvent(data);
    };
  }

  async function loadMeta() {
    try {
      const [toolsRes, configRes] = await Promise.all([fetch('/api/tools'), fetch('/api/config')]);
      const tools = await toolsRes.json(); const config = await configRes.json();
      const box = document.getElementById('tools'); box.textContent = '';
      (tools.tools || []).forEach(t => { const b = el('div', 'tool'); b.appendChild(el('div', 'name', t.name)); b.appendChild(el('div', 'desc', t.description)); box.appendChild(b); });
      const pl = document.getElementById('plugins'); pl.textContent = '';
      (config.plugins || []).forEach(p => pl.appendChild(el('span', '', p)));
      const sv = document.getElementById('services'); sv.textContent = '';
      (config.services || []).forEach(s => sv.appendChild(el('span', '', s)));
    } catch (err) {}
  }

  async function loadProviders() {
    let data;
    try { data = await (await fetch('/api/providers')).json(); } catch (err) { providerList.textContent = '加载失败'; return; }
    renderProviders(data);
  }

  function renderProviders(data) {
    providerList.textContent = '';
    const providers = data.providers || [];
    const models = data.models || {};
    const active = data.active || {};
    const activeProv = providers.find(p => p.id === active.provider);
    activeModelEl.textContent = active.model
      ? '模型：' + (activeProv ? activeProv.name : active.provider) + ' / ' + active.model
      : '模型：未选择';

    if (providers.length === 0) {
      providerList.appendChild(el('div', 'hint', '还没有 Provider，请在下方添加。'));
      return;
    }

    providers.forEach(p => {
      const box = el('div', 'provider');
      const head = el('div', 'head');
      const info = el('div', 'info');
      info.appendChild(el('div', 'name', p.name));
      info.appendChild(el('div', 'url', p.base_url));
      head.appendChild(info);
      if (active.provider === p.id) head.appendChild(el('span', 'badge', '使用中'));
      const discover = el('button', 'small', '发现模型');
      discover.onclick = () => discoverModels(p.id);
      head.appendChild(discover);
      const del = el('button', 'small danger', '删除');
      del.onclick = () => removeProvider(p.id);
      head.appendChild(del);
      box.appendChild(head);

      const chips = el('div', 'models');
      const list = models[p.id] || [];
      if (list.length === 0) box.appendChild(el('div', 'hint', '尚未发现模型，点击「发现模型」。'));
      list.forEach(m => {
        const chip = el('div', 'model-chip' + (active.provider === p.id && active.model === m.id ? ' active' : ''), m.id);
        chip.onclick = () => selectModel(p.id, m.id);
        chips.appendChild(chip);
      });
      box.appendChild(chips);
      providerList.appendChild(box);
    });
  }

  async function discoverModels(id) {
    await fetch('/api/providers/' + encodeURIComponent(id) + '/discover', { method: 'POST' });
    loadProviders();
  }
  async function removeProvider(id) {
    if (!confirm('删除该 Provider？')) return;
    await fetch('/api/providers/' + encodeURIComponent(id), { method: 'DELETE' });
    loadProviders();
  }
  async function selectModel(provider, model) {
    await fetch('/api/active', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider, model }) });
    loadProviders();
  }

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(addForm);
    await fetch('/api/providers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: '', name: f.get('name'), base_url: f.get('base_url'), api_key: f.get('api_key') })
    });
    addForm.reset();
    loadProviders();
  });

  document.getElementById('settingsBtn').onclick = () => { overlay.classList.remove('hidden'); loadProviders(); };
  document.getElementById('closeBtn').onclick = () => overlay.classList.add('hidden');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.add('hidden'); });

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  loadMeta(); loadProviders(); connect(); input.focus();
})();
</script>
</body>
</html>
