<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rust Harness</title>
<style>
  :root {
    /* Claude / Anthropic warm "parchment & clay" palette */
    --bg: #f5f4ed;
    --surface: #faf9f5;
    --frost: rgba(250, 249, 245, 0.78);
    --hover: rgba(20, 20, 19, 0.05);
    --border: rgba(20, 20, 19, 0.08);
    --border-2: rgba(20, 20, 19, 0.15);
    --text: #141413;
    --text-2: #46453f;
    --caption: #8a8983;
    --accent: #c96442;
    --accent-hover: #b5573a;
    --accent-soft: rgba(201, 100, 66, 0.1);
    --bubble: #ece5d6;
    --error: #b53333;
    --success: #17a34a;
    --warning: #eab308;
    --focus: #0071e3;
    --chat-width: 720px;
    --composer-width: 720px;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(20, 20, 19, 0.04), 0 2px 8px rgba(20, 20, 19, 0.05);
    --shadow-lg: 0 12px 40px rgba(20, 20, 19, 0.13);
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
      'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-display: Georgia, 'Times New Roman', 'Songti SC', 'STSong', serif;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
    background: var(--bg);
    display: flex; height: 100%; overflow: hidden;
    letter-spacing: -0.01em;
  }
  button, input, select, textarea { font-family: inherit; letter-spacing: inherit; }

  /* ---------- Sidebar ---------- */
  aside {
    width: 276px; flex: none;
    background: var(--frost);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    backdrop-filter: blur(24px) saturate(1.2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { display: flex; align-items: center; gap: 11px; padding: 20px 18px 14px; }
  .logo { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: linear-gradient(145deg, #d97b55, #c96442); color: #faf9f5; box-shadow: 0 3px 10px rgba(201, 100, 66, 0.28); }
  .side-head .title { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
  .side-head .sub { font-size: 11px; color: var(--caption); }
  .new-session {
    margin: 4px 14px 8px; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: none; background: var(--accent); color: #faf9f5; border-radius: 12px;
    padding: 9px 14px; font-size: 13.5px; font-weight: 500; cursor: pointer;
    box-shadow: 0 2px 8px rgba(201, 100, 66, 0.22);
    transition: background .15s var(--ease), transform .1s var(--ease);
  }
  .new-session:hover { background: var(--accent-hover); }
  .new-session:active { transform: scale(0.98); }
  .side-scroll { flex: 1; overflow-y: auto; padding: 4px 12px 8px; min-height: 0; }
  .side-label {
    font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
    color: var(--caption); padding: 12px 6px 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .side-label .mini { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--accent); cursor: pointer; border: none; background: none; padding: 0; }
  .side-label .mini:hover { text-decoration: underline; }

  .session-item { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 10px; cursor: pointer; color: var(--text-2); font-size: 13.5px; transition: background .12s var(--ease); }
  .session-item.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 500; }
  .session-item:hover:not(.active) { background: var(--hover); }
  .session-item .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .x { display: none; border: none; background: none; color: var(--caption); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 3px; border-radius: 6px; }
  .session-item:hover .x { display: block; }
  .session-item .x:hover { color: var(--error); }

  .task-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; font-size: 13px; color: var(--text-2); }
  .task-item:hover { background: var(--hover); }
  .task-item .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .task-item .done { text-decoration: line-through; color: var(--caption); }
  .task-item .x { display: none; border: none; background: none; color: var(--caption); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 3px; }
  .task-item:hover .x { display: block; }
  .task-item .x:hover { color: var(--error); }
  .task-status { font-size: 10px; font-weight: 500; border-radius: 999px; padding: 1px 8px; flex: none; }
  .task-status.pending { color: var(--caption); background: rgba(20,20,19,0.05); }
  .task-status.in_progress { color: var(--accent-hover); background: var(--accent-soft); }
  .task-status.completed { color: var(--success); background: rgba(23,163,74,0.12); }
  .task-status.cancelled { color: var(--caption); background: rgba(20,20,19,0.05); }
  .taskbar { height: 5px; background: rgba(20,20,19,0.06); border-radius: 3px; margin: 2px 5px 10px; overflow: hidden; }
  .taskbar .fill { height: 100%; background: linear-gradient(90deg, #d97b55, #c96442); border-radius: 3px; transition: width .3s var(--ease); }
  .task-progress { font-size: 11px; color: var(--caption); padding: 0 5px; }
  .add-task { display: flex; gap: 6px; margin-top: 6px; }
  .add-task input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s; }
  .add-task input:focus { border-color: var(--focus); }
  .add-task button { border: none; background: var(--accent); color: #faf9f5; border-radius: 9px; padding: 0 13px; font-size: 13px; cursor: pointer; }

  .side-foot { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .side-foot button { display: flex; align-items: center; gap: 10px; background: none; border: none; color: var(--text-2); font-size: 13px; padding: 9px 11px; border-radius: 10px; cursor: pointer; text-align: left; transition: background .12s; }
  .side-foot button:hover { background: var(--hover); color: var(--text); }
  .side-foot .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--caption); flex: none; }
  .side-foot .status-dot.on { background: var(--success); }
  .side-foot .status-dot.working { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .export-row { display: flex; gap: 6px; padding: 4px 10px; }
  .export-row button { flex: 1; justify-content: center; border: 1px solid var(--border); border-radius: 9px; padding: 7px 0; font-size: 12px; }

  /* ---------- Main / chat ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); position: relative; }

  /* Top-right subagent panel */
  .subagents { position: absolute; top: 14px; right: 18px; z-index: 20; display: flex; flex-direction: column; gap: 8px; max-width: 320px; pointer-events: none; }
  .subagent { pointer-events: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; box-shadow: var(--shadow-lg); padding: 10px 13px; font-size: 12.5px; animation: subagent-in .2s var(--ease); }
  @keyframes subagent-in { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
  .subagent .top { display: flex; align-items: center; gap: 8px; }
  .subagent .icon { flex: none; }
  .subagent .name { flex: 1; min-width: 0; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subagent .status { font-size: 10px; font-weight: 500; border-radius: 999px; padding: 1px 8px; flex: none; }
  .subagent .status.running { color: var(--accent-hover); background: var(--accent-soft); }
  .subagent .status.ok { color: var(--success); background: rgba(23,163,74,0.12); }
  .subagent .status.err { color: var(--error); background: rgba(181,51,51,0.1); }
  .subagent .activity { margin-top: 4px; color: var(--caption); font-size: 11.5px; }
  .subagent.running { position: relative; overflow: hidden; }
  .subagent.running::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(201,100,66,0.12) 45%, rgba(217,123,85,0.2) 50%, rgba(201,100,66,0.12) 55%, transparent 80%);
    background-size: 250% 100%;
    animation: shimmer 1.6s linear infinite;
  }

  .hero { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; pointer-events: none; transition: opacity .25s var(--ease); }
  .hero.hidden { opacity: 0; }
  .hero .glow { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(201, 100, 66, 0.12), rgba(201, 100, 66, 0) 70%); display: grid; place-items: center; }
  .hero .mark { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; font-size: 40px; background: linear-gradient(145deg, #d97b55, #c96442); color: #faf9f5; box-shadow: 0 10px 32px rgba(201, 100, 66, 0.26); }
  .hero h1 { margin: 8px 0 0; font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .hero p { margin: 0; font-size: 13.5px; color: var(--caption); }

  #transcript { flex: 1; overflow-y: auto; min-height: 0; padding: 28px 20px; }
  .column { max-width: var(--chat-width); width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .turn-sep { display: flex; align-items: center; gap: 14px; color: var(--caption); font-size: 11px; margin: 2px 0; }
  .turn-sep::before, .turn-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble {
    max-width: min(540px, 82%);
    background: var(--bubble); color: var(--text);
    border-radius: 20px; border-bottom-right-radius: 6px;
    padding: 11px 17px; font-size: 15.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-assistant { display: flex; gap: 13px; }
  .avatar { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: linear-gradient(145deg, #d97b55, #c96442); color: #faf9f5; box-shadow: 0 2px 6px rgba(201, 100, 66, 0.24); }
  .msg-assistant .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 11px; }
  .msg-assistant .text { font-size: 15.5px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .tool-call { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 7px 13px; font-size: 12.5px; color: var(--text-2); box-shadow: var(--shadow-sm); }
  .tool-call .name { font-family: var(--mono); color: var(--accent-hover); font-weight: 600; }
  .tool-result { border-left: 2px solid var(--border); padding: 2px 0 2px 13px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: var(--text-2); white-space: pre-wrap; word-break: break-word; }
  .tool-result.error { border-left-color: var(--error); }
  .tool-result .ok { color: var(--success); }
  .tool-result .err { color: var(--error); }

  .reasoning { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); align-self: flex-start; max-width: 100%; box-shadow: var(--shadow-sm); }
  .reasoning .head { display: flex; align-items: center; gap: 6px; padding: 7px 13px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--caption); user-select: none; transition: color .15s; }
  .reasoning .head:hover { color: var(--text-2); }
  .reasoning .body { padding: 2px 13px 11px; font-size: 13px; line-height: 1.6; color: var(--caption); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow-y: auto; }
  .reasoning.collapsed .body { display: none; }
  .reasoning.breathing { animation: reasoning-breathe 2.2s ease-in-out infinite; }
  .reasoning.breathing .head { color: var(--accent-hover); }
  .reasoning.breathing .head .dots::after { content: '…'; animation: dots 1.2s steps(4) infinite; display: inline-block; }
  @keyframes reasoning-breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 100, 66, 0); border-color: var(--border); }
    50% { box-shadow: 0 0 0 4px rgba(201, 100, 66, 0.11); border-color: rgba(201, 100, 66, 0.4); }
  }
  @keyframes dots { 0% { width: 0; } 100% { width: 1em; } }

  .toolcard { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); align-self: flex-start; max-width: 100%; box-shadow: var(--shadow-sm); }
  .toolcard .head { display: flex; align-items: center; gap: 7px; padding: 7px 13px; cursor: pointer; font-size: 12.5px; user-select: none; }
  .toolcard .head .name { font-family: var(--mono); font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolcard .head .chev { color: var(--caption); font-size: 10px; flex: none; }
  .toolcard .status { font-size: 10px; font-weight: 500; border-radius: 999px; padding: 1px 8px; flex: none; }
  .toolcard .status.running { color: var(--accent-hover); background: var(--accent-soft); animation: pulse 1.1s ease-in-out infinite; }
  .toolcard .status.ok { color: var(--success); background: rgba(23,163,74,0.12); }
  .toolcard .status.err { color: var(--error); background: rgba(181,51,51,0.1); }
  .toolcard .body { padding: 0 13px 10px; font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
  .toolcard .body .sec { margin-top: 8px; color: var(--caption); font-size: 11px; font-weight: 600; }
  .toolcard.collapsed .body { display: none; }

  /* ---------- Composer ---------- */
  .composer { flex: none; display: flex; flex-direction: column; align-items: center; padding: 8px 20px 18px; }
  .card {
    box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: var(--composer-width);
    border: 1px solid var(--border-2); border-radius: 22px;
    background: var(--surface); box-shadow: var(--shadow-lg);
    padding: 12px 12px 8px;
  }
  .card textarea { width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text); font-size: 16px; line-height: 1.5; padding: 4px 12px 0 14px; min-height: 32px; max-height: 200px; }
  .card textarea::placeholder { color: var(--caption); }
  .card .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 8px 4px; }

  /* Custom dropdown */
  .dropdown { position: relative; }
  .dropdown-btn {
    display: flex; align-items: center; gap: 6px;
    max-width: 260px; height: 32px; padding: 0 13px;
    border: 1px solid var(--border-2); border-radius: 999px; outline: none;
    background: var(--surface); color: var(--text-2);
    font-size: 13px; font-weight: 500; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .dropdown-btn:hover { background: var(--hover); border-color: var(--accent); }
  .dropdown-btn:active { transform: scale(0.97); }
  .dropdown-btn .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dropdown-btn .chev { font-size: 10px; color: var(--caption); transition: transform .2s var(--ease); }
  .dropdown.open .dropdown-btn .chev { transform: rotate(180deg); }
  .dropdown-menu {
    position: absolute; top: calc(100% + 8px); left: 0; min-width: 200px; max-width: 320px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; display: none;
    max-height: 320px; overflow-y: auto;
  }
  .dropdown.open .dropdown-menu { display: block; animation: menu-in .18s var(--ease); }
  .dropdown.drop-up .dropdown-menu { top: auto; bottom: calc(100% + 8px); }
  .dropdown.align-right .dropdown-menu { left: auto; right: 0; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
  .dropdown.drop-up .dropdown-menu { animation-name: menu-in-up; }
  @keyframes menu-in-up { from { opacity: 0; transform: translateY(4px) scale(0.98); } to { opacity: 1; transform: none; } }
  .dropdown-group { font-size: 11px; font-weight: 600; color: var(--caption); padding: 9px 12px 4px; text-transform: uppercase; letter-spacing: .4px; }
  .dropdown-item { padding: 9px 12px; border-radius: 10px; font-size: 13.5px; cursor: pointer; color: var(--text-2); transition: background .1s; }
  .dropdown-item:hover { background: var(--hover); }
  .dropdown-item.selected { color: var(--accent-hover); font-weight: 500; background: var(--accent-soft); }

  .send { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border: none; border-radius: 999px; background: var(--accent); color: #faf9f5; cursor: pointer; box-shadow: 0 2px 8px rgba(201,100,66,0.3); transition: background .15s var(--ease), transform .1s var(--ease), opacity .1s; }
  .send:hover:not(:disabled) { background: var(--accent-hover); }
  .send:active:not(:disabled) { transform: scale(0.94); }
  .send:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  .composer-hint { font-size: 11px; color: var(--caption); margin-top: 9px; }

  /* ---------- Trellis stepper ---------- */
  .trellis { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 11px 16px; border-bottom: 1px solid var(--border); background: var(--frost); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); flex-wrap: wrap; }
  .trellis .step { font-size: 12px; font-weight: 500; color: var(--caption); padding: 5px 13px; border-radius: 999px; }
  .trellis .step.done { color: var(--accent-hover); }
  .trellis .step.active { color: #faf9f5; background: var(--accent); }
  .trellis .arrow { color: var(--caption); font-size: 11px; }

  /* ---------- Activity side panel ---------- */
  .activity {
    width: 300px; flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--frost);
    -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2);
    border-left: 1px solid var(--border);
    transition: margin-right .25s var(--ease);
  }
  .activity.collapsed { margin-right: -300px; }
  .activity-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
  .activity-head .title { font-size: 13px; font-weight: 600; }
  .activity-head .toggle { border: none; background: none; color: var(--caption); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: transform .25s var(--ease); }
  .activity-head .toggle:hover { color: var(--text); }
  .activity.collapsed .toggle { transform: rotate(180deg); }
  .activity-body { flex: 1; overflow-y: auto; padding: 4px 12px 16px; min-height: 0; }

  .act-item { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 8px; overflow: hidden; }
  .act-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; font-size: 12.5px; }
  .act-head .chev { color: var(--caption); font-size: 10px; flex: none; }
  .act-head .icon { flex: none; }
  .act-head .name { flex: 1; min-width: 0; font-family: var(--mono); font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-status { font-size: 10px; font-weight: 500; border-radius: 999px; padding: 1px 8px; flex: none; }
  .act-status.running { color: var(--accent-hover); background: var(--accent-soft); }
  .act-status.ok { color: var(--success); background: rgba(23,163,74,0.12); }
  .act-status.err { color: var(--error); background: rgba(181,51,51,0.1); }
  .act-body { display: none; padding: 0 12px 10px 32px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; }
  .act-body .sec { margin-top: 8px; color: var(--caption); font-size: 10.5px; font-weight: 600; }
  .act-item.open .act-body { display: block; }
  .act-item.running { position: relative; }
  .act-item.running::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(201,100,66,0.12) 45%, rgba(217,123,85,0.2) 50%, rgba(201,100,66,0.12) 55%, transparent 80%);
    background-size: 250% 100%;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -50% 0; } }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20, 20, 19, 0.3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 30; }
  .overlay.hidden { display: none; }
  .modal {
    width: 660px; max-width: 94vw; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow-lg);
    padding: 24px 26px;
  }
  .modal h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .modal .desc { margin: 0 0 18px; font-size: 13px; color: var(--caption); }
  .provider { border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 12px; }
  .provider .head { display: flex; align-items: center; gap: 10px; }
  .provider .head .info { flex: 1; min-width: 0; }
  .provider .head .name { font-weight: 600; font-size: 14px; }
  .provider .head .url { font-size: 12px; color: var(--caption); font-family: var(--mono); word-break: break-all; }
  .badge { font-size: 11px; font-weight: 500; color: var(--accent-hover); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; flex: none; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .model-chip { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--text-2); background: var(--surface); font-family: var(--mono); transition: all .12s var(--ease); }
  .model-chip:hover { border-color: var(--accent); color: var(--accent-hover); }
  .model-chip.active { border-color: var(--accent); color: var(--accent-hover); background: var(--accent-soft); }
  .hint { font-size: 12px; color: var(--caption); margin-top: 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .mkt { border: 1px solid var(--border); border-radius: 13px; padding: 10px 13px; margin-bottom: 8px; }
  .mkt .row { display: flex; align-items: center; gap: 8px; }
  .mkt .info { flex: 1; min-width: 0; }
  .mkt .name { font-weight: 600; font-size: 13px; }
  .mkt .desc { font-size: 12px; color: var(--text-2); margin: 0; }
  .mkt .cmd { font-family: var(--mono); font-size: 11px; color: var(--caption); word-break: break-all; margin-top: 3px; }
  button.small { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 12px; transition: all .12s var(--ease); }
  button.small:hover { border-color: var(--accent); color: var(--accent-hover); }
  button.small.danger:hover { border-color: var(--error); color: var(--error); }
  form.add { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  form.add h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
  form.add label { font-size: 12.5px; font-weight: 500; color: var(--text-2); display: flex; flex-direction: column; gap: 5px; }
  form.add input { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 9px 12px; font-size: 13px; outline: none; transition: border-color .15s, background .15s; }
  form.add input:focus { border-color: var(--focus); background: var(--surface); }
  button.primary { background: var(--accent); border: none; color: #faf9f5; border-radius: 11px; padding: 10px 18px; font-weight: 500; cursor: pointer; font-size: 13px; align-self: flex-start; transition: background .15s var(--ease); }
  button.primary:hover { background: var(--accent-hover); }
  .modal-foot { display: flex; justify-content: flex-end; margin-top: 18px; }

  /* Interaction feedback */
  button { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:not(:disabled) { cursor: pointer; }
  button.small, button.primary, .model-chip, .dropdown-item, .session-item, .task-item,
  .side-foot button, .export-row button, .mkt .row button {
    transition: background .14s var(--ease), color .14s var(--ease), border-color .14s var(--ease), transform .1s var(--ease);
  }
  button.small:active, button.primary:active, .model-chip:active, .session-item:active,
  .task-item:active, .side-foot button:active, .export-row button:active, .dropdown-item:active,
  .new-session:active { transform: scale(0.97); }
  button.small:active { background: var(--hover); }
  .model-chip:active { background: var(--accent-soft); }
  .dropdown-item:active { background: var(--hover); }

  .hidden { display: none; }
</style>
</head>
<body>
  <aside>
    <div class="side-head">
      <div class="logo">🐋</div>
      <div><div class="title">Rust Harness</div><div class="sub">多模型 · 工具调用</div></div>
    </div>
    <button class="new-session" id="newSession">＋ 新会话</button>
    <div class="side-scroll">
      <div class="side-label">会话</div>
      <div id="sessionList"></div>
      <div class="side-label">工作区 <button class="mini" id="wsChangeBtn">更改</button></div>
      <div id="workspaceBox"><div class="hint">加载中…</div></div>
      <div class="side-label">任务 <button class="mini" id="taskAddBtn" style="display:none">＋</button></div>
      <div id="taskList"><div class="hint">暂无任务</div></div>
      <div class="add-task"><input id="taskInput" placeholder="添加任务…" /><button id="taskAdd">加</button></div>
    </div>
    <div class="side-foot">
      <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;color:var(--ds-caption);font-size:12px;"><span class="status-dot" id="dot"></span><span id="statusText">连接中…</span></div>
      <div class="export-row">
        <button id="exportMd">导出 Markdown</button>
        <button id="exportJson">导出 JSON</button>
      </div>
      <button id="settingsBtn">⚙ 模型设置</button>
    </div>
  </aside>

  <main>
    <div class="subagents" id="subagents"></div>
    <div class="hero" id="hero">
      <div class="glow"><div class="mark">🐋</div></div>
      <h1>有什么可以帮你？</h1>
      <p>Rust Harness · 实时流式 · 工具调用 · 多模型</p>
    </div>
    <div id="trellisBar" class="trellis hidden"></div>
    <div id="transcript"><div class="column" id="column"></div></div>
    <div class="composer">
      <div class="card">
        <textarea id="input" placeholder="给 Rust Harness 发送消息…" rows="1"></textarea>
        <div class="row">
          <div class="dropdown" id="modeDropdown">
            <button class="dropdown-btn" type="button"><span class="label">直接对话</span><span class="chev">▾</span></button>
            <div class="dropdown-menu"></div>
          </div>
          <div class="dropdown" id="modelDropdown">
            <button class="dropdown-btn" type="button"><span class="label">选择模型</span><span class="chev">▾</span></button>
            <div class="dropdown-menu"></div>
          </div>
          <button class="send" id="send" title="发送" aria-label="发送">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L4 7M8 3L12 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="composer-hint">内容由所选模型生成，工具会在会话中真实执行</div>
    </div>
  </main>

  <section class="activity" id="activityPanel">
    <div class="activity-head">
      <span class="title">活动</span>
      <button class="toggle" id="activityToggle" title="收起">»</button>
    </div>
    <div class="activity-body" id="activityBody">
      <div class="hint">暂无活动</div>
    </div>
  </section>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <h2>设置</h2>
      <p class="desc">模型、MCP 服务器、技能与工具。</p>
      <div id="providerList">加载中…</div>
      <form class="add" id="addForm">
        <h3>添加 Provider</h3>
        <label>名称<input name="name" placeholder="例如：DeepSeek / OpenAI / 本地 Ollama" /></label>
        <label>Base URL<input name="base_url" placeholder="https://api.deepseek.com" /></label>
        <label>API Key<input name="api_key" type="password" placeholder="sk-…" /></label>
        <button class="primary" type="submit">保存 Provider</button>
      </form>

      <div style="margin-top:18px; border-top:1px solid var(--ds-border); padding-top:16px;">
        <h3 style="font-size:13px; margin:0 0 10px;">MCP 服务器</h3>
        <p class="desc">粘贴启动命令即可，工具会自动桥接进 harness。点下面预设可一键填入。</p>
        <input id="mcpSearch" placeholder="🔍 搜索 MCP 服务器市场…" style="width:100%; box-sizing:border-box; background:var(--ds-sidebar); border:1px solid var(--ds-border); border-radius:8px; color:var(--ds-text); padding:8px 11px; font-size:13px; outline:none; margin-bottom:10px;" />
        <div id="mcpMarket"></div>
        <div class="side-label">已添加</div>
        <div id="mcpList">加载中…</div>
        <form class="add" id="mcpForm" style="margin-top:12px; border-top:none; padding-top:0;">
          <label>启动命令（必填）<input name="command" placeholder="npx -y @modelcontextprotocol/server-filesystem /tmp" /></label>
          <label>名称（可选，留空自动推导）<input name="name" placeholder="例如：filesystem" /></label>
          <button class="primary" type="submit">添加</button>
        </form>
      </div>
      <div style="margin-top:18px; border-top:1px solid var(--ds-border); padding-top:14px;">
        <div class="side-label">技能</div>
        <div id="skillsSide" class="kv"></div>
        <div class="side-label">工具</div>
        <div id="toolsSide" class="kv"></div>
      </div>
      <div class="modal-foot"><button class="small" id="closeBtn">关闭</button></div>
    </div>
  </div>

<script>
(function () {
  const column = document.getElementById('column');
  const transcript = document.getElementById('transcript');
  const hero = document.getElementById('hero');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const overlay = document.getElementById('overlay');
  const providerList = document.getElementById('providerList');
  const addForm = document.getElementById('addForm');
  const sessionList = document.getElementById('sessionList');
  const taskList = document.getElementById('taskList');
  const taskInput = document.getElementById('taskInput');

  let ws, currentAssistant = null, currentReasoning = null, currentTool = null, working = false, hasMessages = false;
  let currentSessionId = null;
  let currentMode = 'direct';
  let providersData = { providers: [], models: {}, active: {} };

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }

  function makeDropdown(id, onChange) {
    const dd = document.getElementById(id);
    const btn = dd.querySelector('.dropdown-btn');
    const menu = dd.querySelector('.dropdown-menu');
    const label = btn.querySelector('.label');
    btn.onclick = (e) => {
      e.stopPropagation();
      document.querySelectorAll('.dropdown.open').forEach(d => { if (d !== dd) d.classList.remove('open'); });
      const willOpen = !dd.classList.contains('open');
      dd.classList.toggle('open');
      if (willOpen) {
        const menu = dd.querySelector('.dropdown-menu');
        const rect = btn.getBoundingClientRect();
        dd.classList.remove('drop-up', 'align-right');
        const mh = menu.offsetHeight;
        const mw = menu.offsetWidth;
        if (rect.bottom + mh + 12 > window.innerHeight) dd.classList.add('drop-up');
        if (rect.left + mw > window.innerWidth - 8) dd.classList.add('align-right');
      }
    };
    document.addEventListener('click', () => dd.classList.remove('open'));
    return {
      setLabel(text) { label.textContent = text; },
      setItems(items) {
        menu.textContent = '';
        let lastGroup = '';
        items.forEach(it => {
          if (it.group && it.group !== lastGroup) { menu.appendChild(el('div', 'dropdown-group', it.group)); lastGroup = it.group; }
          const d = el('div', 'dropdown-item' + (it.selected ? ' selected' : ''), it.label);
          d.onclick = () => { dd.classList.remove('open'); onChange(it.value); };
          menu.appendChild(d);
        });
      }
    };
  }
  function setStatus(s, t) { dot.className = 'status-dot ' + s; statusText.textContent = t; }
  function setWorking(on) { working = on; sendBtn.disabled = on; setStatus(on ? 'working' : 'on', on ? '工作中…' : '已连接'); }
  function setHero(show) { hero.classList.toggle('hidden', !show); }
  function scrollBottom() { transcript.scrollTop = transcript.scrollHeight; }
  function textFromContent(c) { return Array.isArray(c) ? c.filter(b => b.kind === 'text').map(b => b.text).join('\n') : ''; }
  function showMessage() { if (!hasMessages) { hasMessages = true; setHero(false); } }
  function addRow(node) { column.appendChild(node); scrollBottom(); showMessage(); }

  function ensureAssistant() {
    if (currentAssistant) return currentAssistant;
    const row = el('div', 'msg-assistant');
    row.appendChild(el('div', 'avatar', '🐋'));
    const body = el('div', 'body');
    const text = el('div', 'text', '');
    body.appendChild(text); row.appendChild(body); addRow(row);
    currentAssistant = { text };
    return currentAssistant;
  }

  function addActivity(icon, name) {
    const body = document.getElementById('activityBody');
    const hint = body.querySelector('.hint');
    if (hint) hint.remove();
    const item = el('div', 'act-item open running');
    const head = el('div', 'act-head');
    const chev = el('span', 'chev', '▾');
    head.appendChild(chev);
    head.appendChild(el('span', 'icon', icon));
    head.appendChild(el('span', 'name', name));
    const status = el('span', 'act-status running', '运行中');
    head.appendChild(status);
    head.onclick = () => {
      const open = item.classList.toggle('open');
      chev.textContent = open ? '▾' : '▸';
    };
    item.appendChild(head);
    const bd = el('div', 'act-body', '');
    item.appendChild(bd);
    body.appendChild(item);
    body.scrollTop = body.scrollHeight;
    return {
      item, body: bd, status, chev,
      finish(ok, statusText) {
        item.classList.remove('running', 'open');
        status.textContent = statusText;
        status.className = 'act-status ' + (ok ? 'ok' : 'err');
        chev.textContent = '▸';
        body.scrollTop = body.scrollHeight;
      }
    };
  }
  function clearActivity() {
    const body = document.getElementById('activityBody');
    body.textContent = '';
    body.appendChild(el('div', 'hint', '暂无活动'));
  }

  function renderEvent(ev) {
    switch (ev.type) {
      case 'user_message': { const row = el('div', 'msg-user'); row.appendChild(el('div', 'bubble', textFromContent(ev.content))); addRow(row); currentAssistant = null; currentTool = null; break; }
      case 'assistant_chunk': { ensureAssistant().text.textContent += ev.text; scrollBottom(); break; }
      case 'reasoning_chunk': { if (!currentReasoning) currentReasoning = addActivity('💭', '思考'); currentReasoning.body.appendChild(document.createTextNode(ev.text)); break; }
      case 'assistant_message': { const text = textFromContent(ev.content); if (currentAssistant) { if (text && !currentAssistant.text.textContent) currentAssistant.text.textContent = text; currentAssistant = null; } else if (text) { ensureAssistant().text.textContent = text; currentAssistant = null; } if (currentReasoning) { currentReasoning.finish(true, '完成'); currentReasoning = null; } currentTool = null; break; }
      case 'tool_call': { currentTool = addActivity('⚙', ev.tool_name); currentTool.body.appendChild(el('div', 'sec', '参数')); currentTool.body.appendChild(document.createTextNode(JSON.stringify(ev.arguments || {}))); currentAssistant = null; break; }
      case 'tool_result': { if (currentTool) { let out; try { out = typeof ev.output === 'string' ? ev.output : JSON.stringify(ev.output); } catch (e) { out = String(ev.output); } if (out.length > 1200) out = out.slice(0, 1200) + '…'; currentTool.body.appendChild(el('div', 'sec', ev.is_error ? '结果（失败）' : '结果')); currentTool.body.appendChild(document.createTextNode(out)); currentTool.finish(!ev.is_error, ev.is_error ? '✗' : '✓'); currentTool = null; } break; }
      case 'turn_start': { clearActivity(); addRow(el('div', 'turn-sep', '新回合')); break; }
      case 'workflow_step': { if (ev.mode === 'trellis') { currentMode = 'trellis'; modeDropdown.setLabel('Trellis 工作流'); renderTrellis(ev.step); } break; }
      default: break;
    }
  }

  function clearTranscript() { column.textContent = ''; currentAssistant = null; currentReasoning = null; currentTool = null; hasMessages = false; setHero(true); clearActivity(); }

  function send() {
    const text = input.value.trim();
    if (!text || working || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'input', text }));
    input.value = ''; input.style.height = 'auto';
    setWorking(true); showMessage();
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const qs = currentSessionId ? '?session=' + encodeURIComponent(currentSessionId) : '';
    ws = new WebSocket(proto + location.host + '/ws' + qs);
    ws.onopen = () => { setStatus('on', '已连接'); setWorking(false); };
    ws.onclose = () => { setStatus('', '已断开，重连中…'); setTimeout(connect, 1500); };
    ws.onerror = () => setStatus('', '连接错误');
    ws.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch (err) { return; }
      if (data.type === 'hello') {
        if (data.session_id !== currentSessionId) { currentSessionId = data.session_id; loadSessions(); loadTasks(); }
        return;
      }
      if (data.type === 'error') {
        const row = el('div', 'msg-assistant'); row.appendChild(el('div', 'avatar', '✗'));
        const body = el('div', 'body'); const res = el('div', 'tool-result error', '错误：' + data.error);
        body.appendChild(res); row.appendChild(body); addRow(row); setWorking(false); return;
      }
      if (data.type === 'subagent') { handleSubagent(data.update); return; }
      if (data.type === 'turn_end') { setWorking(false); loadTasks(); }
      renderEvent(data);
    };
  }

  // ---------- subagents (Codex-style panel) ----------
  const subagentCards = {};
  function handleSubagent(update) {
    const box = document.getElementById('subagents');
    let card = subagentCards[update.task_id];
    if (!card) {
      const c = el('div', 'subagent');
      const top = el('div', 'top');
      top.appendChild(el('span', 'icon', '🤖'));
      top.appendChild(el('span', 'name', update.description || '子代理'));
      const status = el('span', 'status running', '运行中');
      top.appendChild(status);
      c.appendChild(top);
      const activity = el('div', 'activity', '启动中');
      c.appendChild(activity);
      box.appendChild(c);
      card = { el: c, status, activity };
      subagentCards[update.task_id] = card;
    }
    if (update.status === 'running') {
      card.el.classList.add('running');
      card.status.textContent = '运行中';
      card.status.className = 'status running';
      card.activity.textContent = update.activity || '工作中';
    } else {
      card.el.classList.remove('running');
      const ok = update.status === 'completed';
      card.status.textContent = ok ? '✓' : (update.status === 'cancelled' ? '取消' : '✗');
      card.status.className = 'status ' + (ok ? 'ok' : 'err');
      card.activity.textContent = update.activity || update.status;
      setTimeout(() => { card.el.remove(); delete subagentCards[update.task_id]; }, 5000);
    }
  }

  // ---------- sessions ----------
  async function loadSessions() {
    let data; try { data = await (await fetch('/api/sessions')).json(); } catch (err) { return; }
    renderSessions(data.sessions || []);
  }
  function renderSessions(sessions) {
    sessionList.textContent = '';
    sessions.forEach(s => {
      const item = el('div', 'session-item' + (s.id === currentSessionId ? ' active' : ''));
      item.appendChild(el('span', 'ttl', s.title || '新会话'));
      const x = el('button', 'x', '×');
      x.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
      item.appendChild(x);
      item.onclick = () => switchSession(s.id);
      item.ondblclick = () => renameSessionPrompt(s.id, s.title);
      sessionList.appendChild(item);
    });
  }
  async function switchSession(id) {
    currentSessionId = id;
    clearTranscript();
    try {
      const rec = await (await fetch('/api/sessions/' + encodeURIComponent(id))).json();
      (rec.events || []).forEach(renderEvent);
    } catch (err) {}
    loadSessions(); loadTasks(); loadWorkspace(); loadMode();
    if (ws) ws.close(); else connect();
  }
  async function newSession() {
    let data; try { data = await (await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })).json(); } catch (err) { return; }
    const id = data.created; loadSessions();
    currentSessionId = id; clearTranscript(); loadTasks(); loadWorkspace(); loadMode();
    if (ws) ws.close(); else connect();
  }
  async function renameSessionPrompt(id, old) {
    const title = prompt('重命名会话', old);
    if (!title || title === old) return;
    await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
    loadSessions();
  }
  async function deleteSession(id) {
    if (!confirm('删除该会话？')) return;
    await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
    if (id === currentSessionId) {
      let data; try { data = await (await fetch('/api/sessions')).json(); } catch (err) { data = { sessions: [] }; }
      const sessions = data.sessions || [];
      if (sessions.length) switchSession(sessions[sessions.length - 1].id);
      else { currentSessionId = null; clearTranscript(); loadTasks(); if (ws) ws.close(); }
    }
    loadSessions();
  }

  // ---------- tasks ----------
  async function loadWorkspace() {
    const box = document.getElementById('workspaceBox');
    if (!currentSessionId) { box.textContent = ''; return; }
    try {
      const data = await (await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/workspace')).json();
      box.textContent = '';
      box.appendChild(el('div', 'hint', '📁 ' + data.root));
      const lines = (data.context || '').split('\n').filter(Boolean).slice(1, 9);
      lines.forEach(l => box.appendChild(el('div', 'hint', l)));
    } catch (err) { box.textContent = '加载失败'; }
  }
  async function changeWorkspace() {
    if (!currentSessionId) return;
    const cur = await (await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/workspace')).json();
    const root = prompt('工作区文件夹（绝对路径）', cur.root);
    if (!root || root === cur.root) return;
    await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/workspace', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ root }) });
    loadWorkspace();
  }

  // ---------- trellis work mode ----------
  const TRELLIS_STEPS = ['brainstorm', 'research', 'plan', 'implement', 'review', 'done'];
  const TRELLIS_LABELS = { brainstorm: '头脑风暴', research: '调研', plan: '计划', implement: '实现', review: '审查', done: '完成' };
  function buildTrellisBar() {
    const bar = document.getElementById('trellisBar');
    bar.textContent = '';
    TRELLIS_STEPS.forEach((s, i) => {
      if (i > 0) bar.appendChild(el('span', 'arrow', '→'));
      const step = el('span', 'step', TRELLIS_LABELS[s]);
      step.dataset.step = s;
      bar.appendChild(step);
    });
  }
  function renderTrellis(phase) {
    const bar = document.getElementById('trellisBar');
    bar.classList.toggle('hidden', currentMode !== 'trellis');
    if (currentMode !== 'trellis') return;
    const idx = TRELLIS_STEPS.indexOf(phase);
    bar.querySelectorAll('.step').forEach(s => {
      const si = TRELLIS_STEPS.indexOf(s.dataset.step);
      s.classList.toggle('active', si === idx);
      s.classList.toggle('done', idx >= 0 && si < idx);
    });
  }
  const MODE_LABELS = { direct: '直接对话', plan: '计划模式', trellis: 'Trellis 工作流' };
  const modeDropdown = makeDropdown('modeDropdown', async (v) => {
    currentMode = v;
    modeDropdown.setLabel(MODE_LABELS[v] || v);
    renderTrellis(null);
    if (!currentSessionId) return;
    await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: v }) });
  });
  modeDropdown.setItems([
    { label: '直接对话', value: 'direct' },
    { label: '计划模式', value: 'plan' },
    { label: 'Trellis 工作流', value: 'trellis' },
  ]);

  async function loadMode() {
    if (!currentSessionId) { currentMode = 'direct'; modeDropdown.setLabel('直接对话'); renderTrellis(null); return; }
    try {
      const data = await (await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/mode')).json();
      currentMode = data.mode || 'direct';
      modeDropdown.setLabel(MODE_LABELS[currentMode] || '直接对话');
      renderTrellis(data.phase);
    } catch (e) {}
  }

  async function loadTasks() {
    if (!currentSessionId) { taskList.textContent = ''; taskList.appendChild(el('div', 'hint', '暂无任务')); return; }
    let data; try { data = await (await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/tasks')).json(); } catch (err) { return; }
    renderTasks(data.tasks || []);
  }
  const TASK_LABELS = { pending: '待办', in_progress: '进行中', completed: '完成', cancelled: '取消' };
  function renderTasks(tasks) {
    taskList.textContent = '';
    const done = tasks.filter(t => t.status === 'completed').length;
    const bar = document.createElement('div');
    bar.className = 'taskbar';
    const fill = document.createElement('div');
    fill.className = 'fill';
    fill.style.width = (tasks.length ? Math.round(done / tasks.length * 100) : 0) + '%';
    bar.appendChild(fill);
    taskList.appendChild(bar);
    const prog = el('div', 'task-progress', tasks.length ? `已完成 ${done}/${tasks.length}` : '暂无任务');
    taskList.appendChild(prog);
    if (!tasks.length) return;
    tasks.forEach(t => {
      const item = el('div', 'task-item');
      const lbl = el('span', 'ttl' + (t.status === 'completed' || t.status === 'cancelled' ? ' done' : ''), t.title);
      item.appendChild(lbl);
      const badge = el('span', 'task-status ' + t.status, TASK_LABELS[t.status] || t.status);
      item.appendChild(badge);
      const x = el('button', 'x', '×');
      x.onclick = () => deleteTask(t.id);
      item.appendChild(x);
      item.onclick = () => cycleTask(t);
      taskList.appendChild(item);
    });
  }
  function cycleTask(t) {
    const order = ['pending', 'in_progress', 'completed', 'pending'];
    const next = order[(order.indexOf(t.status) + 1) % order.length];
    setTaskStatus(t.id, next);
  }
  async function setTaskStatus(taskId, status) {
    if (!currentSessionId) return;
    await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/tasks/' + encodeURIComponent(taskId), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
    loadTasks();
  }
  async function deleteTask(taskId) {
    if (!currentSessionId) return;
    await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/tasks/' + encodeURIComponent(taskId), { method: 'DELETE' });
    loadTasks();
  }
  async function addTask(title) {
    if (!currentSessionId || !title) return;
    await fetch('/api/sessions/' + encodeURIComponent(currentSessionId) + '/tasks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
    loadTasks();
  }

  // ---------- export ----------
  function download(url) { const a = document.createElement('a'); a.href = url; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }
  document.getElementById('exportMd').onclick = () => { if (currentSessionId) download('/api/sessions/' + encodeURIComponent(currentSessionId) + '/export?format=markdown'); };
  document.getElementById('exportJson').onclick = () => { if (currentSessionId) download('/api/sessions/' + encodeURIComponent(currentSessionId) + '/export?format=json'); };

  // ---------- meta ----------
  async function loadMeta() {
    try {
      const [tRes] = await Promise.all([fetch('/api/tools')]);
      const tools = await tRes.json();
      const side = document.getElementById('toolsSide'); side.textContent = '';
      (tools.tools || []).forEach(t => { const c = el('span', '', t.name); c.title = t.description; side.appendChild(c); });
    } catch (err) {}
    loadSkills();
  }
  async function loadSkills() {
    try {
      const data = await (await fetch('/api/skills')).json();
      const side = document.getElementById('skillsSide'); side.textContent = '';
      (data.skills || []).forEach(s => { const c = el('span', '', s.name); c.title = s.description; side.appendChild(c); });
    } catch (err) {}
  }

  // ---------- providers ----------
  async function loadProviders() {
    try { providersData = await (await fetch('/api/providers')).json(); } catch (err) { return; }
    renderProviders(); renderModelSelect();
  }
  function renderProviders() {
    providerList.textContent = '';
    const { providers, models, active } = providersData;
    if (!providers.length) { providerList.appendChild(el('div', 'hint', '还没有 Provider，请在下方添加。')); return; }
    providers.forEach(p => {
      const box = el('div', 'provider');
      const head = el('div', 'head');
      const info = el('div', 'info');
      info.appendChild(el('div', 'name', p.name)); info.appendChild(el('div', 'url', p.base_url));
      head.appendChild(info);
      if (active.provider === p.id) head.appendChild(el('span', 'badge', '使用中'));
      const discover = el('button', 'small', '发现模型'); discover.onclick = () => discoverModels(p.id); head.appendChild(discover);
      const del = el('button', 'small danger', '删除'); del.onclick = () => removeProvider(p.id); head.appendChild(del);
      box.appendChild(head);
      const chips = el('div', 'models');
      const list = models[p.id] || [];
      if (!list.length) box.appendChild(el('div', 'hint', '尚未发现模型，点击「发现模型」。'));
      list.forEach(m => { const c = el('div', 'model-chip' + (active.provider === p.id && active.model === m.id ? ' active' : ''), m.id); c.onclick = () => selectModel(p.id, m.id); chips.appendChild(c); });
      box.appendChild(chips); providerList.appendChild(box);
    });
  }
  const modelDropdown = makeDropdown('modelDropdown', (v) => {
    if (!v) return;
    const [provider, model] = v.split('||');
    selectModel(provider, model);
  });
  function renderModelSelect() {
    const { providers, models, active } = providersData;
    if (!providers.length) { modelDropdown.setLabel('未配置模型'); modelDropdown.setItems([]); return; }
    const items = [];
    let activeLabel = '选择模型';
    providers.forEach(p => {
      (models[p.id] || []).forEach(m => {
        const selected = active.provider === p.id && active.model === m.id;
        if (selected) activeLabel = m.id;
        items.push({ label: m.id, value: p.id + '||' + m.id, group: p.name, selected });
      });
    });
    modelDropdown.setLabel(activeLabel);
    modelDropdown.setItems(items);
  }
  async function discoverModels(id) { await fetch('/api/providers/' + encodeURIComponent(id) + '/discover', { method: 'POST' }); loadProviders(); }
  async function removeProvider(id) { if (!confirm('删除该 Provider？')) return; await fetch('/api/providers/' + encodeURIComponent(id), { method: 'DELETE' }); loadProviders(); }
  async function selectModel(provider, model) { await fetch('/api/active', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider, model }) }); loadProviders(); }
  addForm.addEventListener('submit', async (e) => { e.preventDefault(); const f = new FormData(addForm); await fetch('/api/providers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: '', name: f.get('name'), base_url: f.get('base_url'), api_key: f.get('api_key') }) }); addForm.reset(); loadProviders(); });

  // ---------- MCP ----------
  async function loadMcp() {
    let data; try { data = await (await fetch('/api/mcp')).json(); } catch (err) { return; }
    renderMcp(data.servers || []);
  }
  function renderMcp(servers) {
    const box = document.getElementById('mcpList'); box.textContent = '';
    if (!servers.length) { box.appendChild(el('div', 'hint', '暂无 MCP 服务器')); return; }
    servers.forEach(s => {
      const row = el('div', 'provider');
      const head = el('div', 'head');
      const info = el('div', 'info');
      info.appendChild(el('div', 'name', s.name));
      info.appendChild(el('div', 'url', s.command + ' ' + (s.args || []).join(' ')));
      head.appendChild(info);
      const del = el('button', 'small danger', '删除'); del.onclick = () => removeMcp(s.name); head.appendChild(del);
      row.appendChild(head); box.appendChild(row);
    });
  }
  async function removeMcp(name) {
    if (!confirm('删除 MCP 服务器 ' + name + '？')) return;
    await fetch('/api/mcp/' + encodeURIComponent(name), { method: 'DELETE' });
    loadMcp();
  }
  function splitCommand(cmd) {
    const parts = (cmd || '').trim().split(/\s+/).filter(Boolean);
    return { command: parts[0] || '', args: parts.slice(1) };
  }
  function deriveName(command, args) {
    const pkg = args.find(a => /^@?[\w.-]+\/[\w.-]+$/.test(a) && !a.startsWith('/'));
    if (pkg) return pkg.replace(/^@/, '').split('/').pop();
    return command.split(/[/\\]/).pop() || 'mcp';
  }
  document.getElementById('mcpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { command, args } = splitCommand(f.get('command') || '');
    if (!command) return;
    let name = (f.get('name') || '').trim();
    if (!name) name = deriveName(command, args);
    await fetch('/api/mcp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, command, args }) });
    e.target.reset(); loadMcp();
  });
  const mcpCmdInput = document.querySelector('#mcpForm input[name=command]');
  const MCP_MARKET = [
    { name: 'filesystem', desc: '本地文件系统：读写、列目录、搜索', cmd: 'npx -y @modelcontextprotocol/server-filesystem <路径>' },
    { name: 'fetch', desc: '抓取网页为 markdown', cmd: 'npx -y @modelcontextprotocol/server-fetch' },
    { name: 'memory', desc: '持久化知识图谱记忆', cmd: 'npx -y @modelcontextprotocol/server-memory' },
    { name: 'thinking', desc: '顺序推理', cmd: 'npx -y @modelcontextprotocol/server-sequential-thinking' },
    { name: 'git', desc: 'Git 仓库操作', cmd: 'uvx mcp-server-git' },
    { name: 'sqlite', desc: 'SQLite 数据库查询', cmd: 'uvx mcp-server-sqlite --db-path <db路径>' },
    { name: 'time', desc: '当前时间与时区转换', cmd: 'uvx mcp-server-time' },
    { name: 'github', desc: 'GitHub 仓库/issue/PR（需 GITHUB_TOKEN）', cmd: 'npx -y @modelcontextprotocol/server-github' },
    { name: 'everything', desc: '参考/测试服务器（echo 等）', cmd: 'npx -y @modelcontextprotocol/server-everything' },
    { name: 'puppeteer', desc: '无头浏览器自动化', cmd: 'npx -y @modelcontextprotocol/server-puppeteer' },
    { name: 'postgres', desc: 'PostgreSQL 查询', cmd: 'npx -y @modelcontextprotocol/server-postgres <连接串>' },
    { name: 'brave-search', desc: 'Brave 搜索（需 BRAVE_API_KEY）', cmd: 'npx -y @modelcontextprotocol/server-brave-search' }
  ];

  function renderMarket(filter) {
    const box = document.getElementById('mcpMarket');
    box.textContent = '';
    const q = (filter || '').toLowerCase();
    const items = MCP_MARKET.filter(m => !q || (m.name + m.desc).toLowerCase().includes(q));
    items.forEach(m => {
      const card = el('div', 'mkt');
      const row = el('div', 'row');
      const info = el('div', 'info');
      info.appendChild(el('div', 'name', m.name));
      info.appendChild(el('div', 'desc', m.desc));
      info.appendChild(el('div', 'cmd', m.cmd));
      row.appendChild(info);
      const add = el('button', 'small', '添加');
      add.onclick = () => installMarket(m.cmd);
      row.appendChild(add);
      card.appendChild(row);
      box.appendChild(card);
    });
    if (!items.length) box.appendChild(el('div', 'hint', '没有匹配的服务器'));
  }

  function installMarket(cmd) {
    if (cmd.includes('<')) { mcpCmdInput.value = cmd; mcpCmdInput.focus(); return; }
    const { command, args } = splitCommand(cmd);
    fetch('/api/mcp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: deriveName(command, args), command, args }) }).then(loadMcp);
  }

  document.getElementById('mcpSearch').addEventListener('input', (e) => renderMarket(e.target.value));
  renderMarket('');

  // ---------- wiring ----------
  document.getElementById('newSession').onclick = newSession;
  document.getElementById('activityToggle').onclick = () => document.getElementById('activityPanel').classList.toggle('collapsed');
  document.getElementById('wsChangeBtn').onclick = changeWorkspace;
  document.getElementById('settingsBtn').onclick = () => { overlay.classList.remove('hidden'); loadProviders(); loadMcp(); loadMeta(); };
  document.getElementById('closeBtn').onclick = () => overlay.classList.add('hidden');
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.add('hidden'); });
  document.getElementById('taskAdd').onclick = () => { addTask(taskInput.value.trim()); taskInput.value = ''; };
  taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { addTask(taskInput.value.trim()); taskInput.value = ''; } });
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });

  // ---------- boot ----------
  (async function boot() {
    loadMeta(); loadProviders();
    let data; try { data = await (await fetch('/api/sessions')).json(); } catch (err) { data = { sessions: [] }; }
    const sessions = data.sessions || [];
    if (!sessions.length) {
      const created = await (await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) })).json();
      currentSessionId = created.created;
    } else {
      currentSessionId = sessions[sessions.length - 1].id;
    }
    loadSessions();
    try {
      const rec = await (await fetch('/api/sessions/' + encodeURIComponent(currentSessionId))).json();
      (rec.events || []).forEach(renderEvent);
    } catch (err) {}
    loadTasks(); loadWorkspace(); buildTrellisBar(); loadMode();
    connect();
  })();
})();
</script>
</body>
</html>
