[workspace]
resolver = "2"
members = [
    "crates/rh-core",
    "crates/rh-tool",
    "crates/rh-session",
    "crates/rh-agent",
    "crates/rh-tools",
    "crates/rh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs", "net"] }

rh-core = { path = "crates/rh-core" }
rh-tool = { path = "crates/rh-tool" }
rh-session = { path = "crates/rh-session" }
rh-agent = { path = "crates/rh-agent" }
rh-tools = { path = "crates/rh-tools" }
